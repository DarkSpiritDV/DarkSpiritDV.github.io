        // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
        function getTrackById(id) {
            return TRACKS.find(t => t.id === id);
        }

        function showToast(msg) {
            if (!toastMsg) return;
            toastMsg.textContent = msg;
            toastMsg.style.opacity = '1';
            clearTimeout(window.dsToastTimeout);
            window.dsToastTimeout = setTimeout(() => {
                toastMsg.style.opacity = '0';
            }, 2000);
        }

        function t(key) {
            const translations = UI_TRANSLATIONS[currentLang] || UI_TRANSLATIONS.ru;
            return translations[key] || key;
        }

        // ===== ПЛЕЕР =====
        function loadTrack(id, autoPlay = false) {
            const track = getTrackById(id);
            if (!track) {
                showToast('❌ ' + (currentLang === 'ru' ? 'Трек не найден' : 'Track not found'));
                return;
            }

            if (audio) {
                audio.src = track.audioSrc;
                audio.load();
            }
            
            if (trackName) {
                trackName.textContent = currentLang === 'ru' ? track.title : track.titleEn;
            }
            
            if (coverImg) {
                coverImg.src = track.cover || 'data:image/svg+xml,%3Csvg%3E';
            }
            
            if (progressFill) {
                progressFill.style.width = '0%';
            }
            
            if (timeDisplay) {
                timeDisplay.textContent = '0:00';
            }

            if (autoPlay && audio) {
                audio.play()
                    .then(() => {
                        isPlaying = true;
                        if (playBtn) playBtn.textContent = '⏸';
                    })
                    .catch(() => showToast('❌ ' + (currentLang === 'ru' ? 'Ошибка воспроизведения' : 'Playback error')));
            } else {
                isPlaying = false;
                if (playBtn) playBtn.textContent = '▶';
            }

            currentTrackId = id;
        }

        function togglePlay() {
            if (!audio) return;
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                if (playBtn) playBtn.textContent = '▶';
            } else {
                audio.play()
                    .then(() => {
                        isPlaying = true;
                        if (playBtn) playBtn.textContent = '⏸';
                    })
                    .catch(() => showToast('❌ ' + (currentLang === 'ru' ? 'Ошибка воспроизведения' : 'Playback error')));
            }
        }

        function nextTrack() {
            if (!TRACKS.length) return;
            const currentIdx = TRACKS.findIndex(t => t.id === currentTrackId);
            const nextIdx = (currentIdx + 1) % TRACKS.length;
            loadTrack(TRACKS[nextIdx].id, true);
        }

        function prevTrack() {
            if (!TRACKS.length) return;
            const currentIdx = TRACKS.findIndex(t => t.id === currentTrackId);
            const prevIdx = (currentIdx - 1 + TRACKS.length) % TRACKS.length;
            loadTrack(TRACKS[prevIdx].id, true);
        }

        function playRandom() {
            if (!TRACKS.length) return;
            const random = TRACKS[Math.floor(Math.random() * TRACKS.length)];
            loadTrack(random.id, true);
            showToast(`🎲 ${currentLang === 'ru' ? 'Случайный трек' : 'Random track'}: ${currentLang === 'ru' ? random.title : random.titleEn}`);
        }

        function updateProgress() {
            if (!audio || !progressFill || !timeDisplay) return;
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                
                const mins = Math.floor(audio.currentTime / 60);
                const secs = Math.floor(audio.currentTime % 60);
                timeDisplay.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
        }

        function setProgress(e) {
            if (!audio || !progressBg) return;
            const rect = progressBg.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = percent * audio.duration;
            }
        }

        // ===== КАТАЛОГ =====
        function renderTracks(tracks) {
            if (!catalogContainer) return;
            if (!tracks.length) {
                catalogContainer.innerHTML = `<div style="text-align:center; color:var(--ds-text-muted);">${t('noTracks')}</div>`;
                return;
            }

            let html = `<div class="ds-music-grid">`;
            tracks.forEach(t => {
                const tooltip = currentLang === 'ru' ? (t.descriptionRu || 'Без описания') : (t.descriptionEn || 'No description');
                html += `
                    <div class="ds-track-card">
                        <div class="ds-tooltip-text">${tooltip}</div>
                        <img class="ds-track-cover" src="${t.cover}" onerror="this.src='data:image/svg+xml,%3Csvg%3E'" alt="${t.title}">
                        <div class="ds-track-title">${currentLang === 'ru' ? t.title : t.titleEn}</div>
                        <div class="ds-track-meta">${t('trackMeta')}</div>
                        <div class="ds-track-actions">
                            <button class="ds-btn ds-btn-sm ds-btn-primary ds-play-track-btn" data-id="${t.id}">▶ ${t('playBtn')}</button>
                            <button class="ds-like-btn ${t.userLiked ? 'ds-liked' : ''}" data-id="${t.id}">${t.userLiked ? '❤️' : '♡'}</button>
                            <span class="ds-likes-count">${t.likes}</span>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            catalogContainer.innerHTML = html;

            catalogContainer.querySelectorAll('.ds-play-track-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    loadTrack(id, true);
                });
            });

            catalogContainer.querySelectorAll('.ds-like-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    const track = getTrackById(id);
                    if (track) {
                        track.userLiked = !track.userLiked;
                        track.likes += track.userLiked ? 1 : -1;
                        if (track.likes < 0) track.likes = 0;
                        renderCatalog();
                    }
                });
            });
        }

            const filtered = TRACKS.filter(t => t.category === 'pop-rap');
            renderTracks(filtered);

        // ===== КАЛЕНДАРЬ =====
        function buildMonth(year, month, releases, monthNameKey, noteKey) {
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startOffset = firstDay === 0 ? 6 : firstDay - 1;
            
            const weekdays = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];
            let html = `
                <div class="ds-calendar-wrapper">
                    <div class="ds-calendar-header">
                        <div class="ds-calendar-month">${t(monthNameKey)}</div>
                        <div class="ds-calendar-legend">
                            <span><span class="ds-legend-dot"></span> Релиз</span>
                        </div>
                    </div>
                    <div class="ds-calendar-grid">
                        ${weekdays.map(wd => `<div class="ds-calendar-weekday">${wd}</div>`).join('')}
            `;
            
            let day = 1;
            let started = false;
            
            for (let week = 0; week < 6; week++) {
                for (let wd = 0; wd < 7; wd++) {
                    if (!started && week === 0 && wd < startOffset) {
                        html += `<div class="ds-calendar-day ds-empty"></div>`;
                    } else if (day <= daysInMonth) {
                        const isRelease = releases[day];
                        const tooltip = isRelease ? (currentLang === 'ru' ? isRelease.ru : isRelease.en) : '';
                        html += `
                            <div class="ds-calendar-day ${isRelease ? 'ds-release-day' : ''}" data-tooltip="${tooltip}">
                                ${day}
                            </div>
                        `;
                        day++;
                        started = true;
                    } else {
                        html += `<div class="ds-calendar-day ds-empty"></div>`;
                    }
                }
            }
            
            html += `
                    </div>
                    <div class="ds-calendar-note">${t(noteKey)}</div>
                </div>
            `;
            
            return html;
        }

        function renderCalendar() {
            const container = document.getElementById('calendarsContainer');

            container.innerHTML = buildMonth(2026, 5, juneReleases, 'juneMonth', 'calendarNoteJune') + 
                                buildMonth(2026, 6, julyReleases, 'julyMonth', 'calendarNoteJuly');
        }

        function startCounters() {
            const counters = [
                { el: document.getElementById('statPlatforms'), target: 32 },
                { el: document.getElementById('statStreams'), target: 921427 },
                { el: document.getElementById('statTracks'), target: 110 }
            ];
            
            counters.forEach(c => {
                if (!c.el) return;
                let current = 0;
                const step = Math.ceil(c.target / 30);
                const timer = setInterval(() => {
                    current += step;
                    if (current >= c.target) {
                        c.el.textContent = c.target.toLocaleString();
                        clearInterval(timer);
                    } else {
                        c.el.textContent = Math.floor(current).toLocaleString();
                    }
                }, 25);
            });
        }

        // ===== VISIT COUNTER =====
        function updateVisitCounter() {
            const counter = document.getElementById('visitCounter');
            if (!counter) return;
            let visits = localStorage.getItem('dsSiteVisits');
            visits = visits ? parseInt(visits) + 1 : 1;
            localStorage.setItem('dsSiteVisits', visits.toString());
            counter.textContent = visits;
        }

        // ===== INIT =====
        function init() {
            // Проверяем наличие audio элемента
            if (!audio) {
                console.error('Audio element not found!');
                return;
            }

            // Плеер
            loadTrack(1, false);
            
            if (playBtn) playBtn.addEventListener('click', togglePlay);
            if (prevBtn) prevBtn.addEventListener('click', prevTrack);
            if (nextBtn) nextBtn.addEventListener('click', nextTrack);
            if (liveRadio) liveRadio.addEventListener('click', playRandom);
            
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', nextTrack);
            
            if (progressBg) progressBg.addEventListener('click', setProgress);
            if (volumeSlider) {
                volumeSlider.addEventListener('input', (e) => {
                    audio.volume = parseFloat(e.target.value);
                });
            }

            // Язык
            document.querySelectorAll('.ds-lang-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.ds-lang-btn').forEach(b => b.classList.remove('ds-active'));
                    btn.classList.add('ds-active');
                    setLanguage(btn.dataset.lang);
                });
            });

            // Вкладки
            document.querySelectorAll('.ds-tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.ds-tab-btn').forEach(b => b.classList.remove('ds-active'));
                    btn.classList.add('ds-active');
                    currentCategory = btn.dataset.tab;
                    renderCatalog();
                });
            });

            // Мобильное меню
            const toggle = document.getElementById('mobileMenuToggle') || document.querySelector('.ds-mobile-menu-toggle');
            const nav = document.getElementById('nav');
            if (toggle && nav) {
                toggle.addEventListener('click', () => {
                    nav.classList.toggle('ds-open');
                });
                nav.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        nav.classList.remove('ds-open');
                    });
                });
            }

            // Плавный скролл
            document.querySelectorAll('a[href^="#ds"]').forEach(anchor => {
                anchor.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.querySelector(anchor.getAttribute('href'));
                    if (target) {
                        window.scrollTo({
                            top: target.offsetTop - 70,
                            behavior: 'smooth'
                        });
                    }
                });
            });

            // Scroll эффект для хедера
            window.addEventListener('scroll', () => {
                const header = document.getElementById('header');
                if (header) {
                    header.classList.toggle('ds-scrolled', window.scrollY > 50);
                }
            }, { passive: true });

            // Fade-in анимация
            document.querySelectorAll('.ds-fade-in-up').forEach(el => {
                el.classList.add('ds-visible');
            });

            // Модалка
            const modal = document.getElementById('photoModal');
            if (modal) {
                const closeBtn = modal.querySelector('.ds-modal-close') || modal.querySelector('.modal-close');
                if (closeBtn) {
                    closeBtn.addEventListener('click', () => {
                        modal.style.display = 'none';
                    });
                }
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) modal.style.display = 'none';
                });
            }

            // Счетчики
            const stats = document.querySelector('.ds-hero-stats');
            if (stats) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            startCounters();
                            observer.disconnect();
                        }
                    });
                }, { threshold: 0.3 });
                observer.observe(stats);
            }

            // Первоначальный рендер
            updateStaticUI();
            renderNews();
            renderPhotos();
            renderCalendar();
            renderCatalog();
            updateVisitCounter();

            // Загрузка первого трека
            loadTrack(1, false);
        }

        // Запуск после загрузки DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>

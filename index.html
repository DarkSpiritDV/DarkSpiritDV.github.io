<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>DarkSpirit — Живое радио | Календарь июнь-июль</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================================
           DARKSPIRIT STYLES — изолированы от глобальных стилей
           ============================================================ */
        
        /* Сброс только для контейнера DarkSpirit */
        .ds-root,
        .ds-root *,
        .ds-root *::before,
        .ds-root *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .ds-root {
            /* Переопределяем любые глобальные переменные */
            --ds-bg-primary: #08080c !important;
            --ds-bg-secondary: #0e0e14 !important;
            --ds-bg-card: #13131b !important;
            --ds-bg-elevated: #1a1a25 !important;
            --ds-border-subtle: rgba(255, 255, 255, 0.04) !important;
            --ds-border-mid: rgba(255, 255, 255, 0.08) !important;
            --ds-text-primary: #e8e6e3 !important;
            --ds-text-secondary: #9d9ba3 !important;
            --ds-text-muted: #6b6972 !important;
            --ds-accent-burgundy: #8b3a4a !important;
            --ds-accent-steel: #9ca3af !important;
            --ds-font-display: 'Playfair Display', 'Georgia', serif !important;
            --ds-font-body: 'Inter', system-ui, sans-serif !important;
            --ds-header-height: 70px !important;
            --ds-radius-sm: 6px !important;
            --ds-radius-md: 12px !important;
            --ds-radius-lg: 20px !important;
            --ds-radius-xl: 28px !important;
            --ds-shadow-card: 0 12px 32px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.02) inset !important;
            --ds-shadow-glow: 0 8px 20px rgba(139, 58, 74, 0.4) !important;
            --ds-transition-smooth: cubic-bezier(0.2, 0.9, 0.4, 1.1) !important;
            
            background-color: var(--ds-bg-primary) !important;
            color: var(--ds-text-primary) !important;
            font-family: var(--ds-font-body) !important;
            line-height: 1.6 !important;
            overflow-x: hidden !important;
            background-image: 
                radial-gradient(ellipse at 20% 15%, rgba(139, 58, 74, 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 60%, rgba(45, 74, 107, 0.05) 0%, transparent 55%) !important;
            min-height: 100vh !important;
            position: relative !important;
            z-index: 1 !important;
        }

        /* Typography */
        .ds-root h1,
        .ds-root h2,
        .ds-root h3,
        .ds-root .ds-font-display {
            font-family: var(--ds-font-display) !important;
            font-weight: 700 !important;
            letter-spacing: -0.01em !important;
        }

        .ds-root h2 {
            font-size: clamp(1.8rem, 4vw, 2.8rem) !important;
            margin-bottom: 0.35em !important;
            position: relative !important;
            display: inline-block !important;
        }

        .ds-root h2::after {
            content: '' !important;
            position: absolute !important;
            bottom: -8px !important;
            left: 0 !important;
            width: 60% !important;
            height: 2px !important;
            background: linear-gradient(90deg, var(--ds-accent-burgundy), transparent) !important;
            border-radius: 4px !important;
        }

        .ds-root .ds-section-subtitle {
            color: var(--ds-text-secondary) !important;
            font-size: 0.85rem !important;
            letter-spacing: 0.08em !important;
            text-transform: uppercase !important;
            margin-bottom: 2rem !important;
            display: block !important;
        }

        .ds-root .ds-container {
            max-width: 1280px !important;
            margin: 0 auto !important;
            padding: 0 1.8rem !important;
        }

        .ds-root section {
            padding: 4rem 0 !important;
            position: relative !important;
        }

        @media (max-width: 768px) {
            .ds-root section {
                padding: 2.5rem 0 !important;
            }
            .ds-root .ds-container {
                padding: 0 1.2rem !important;
            }
        }

        .ds-root .ds-fade-in-up {
            opacity: 0 !important;
            transform: translateY(30px) !important;
            transition: opacity 0.7s var(--ds-transition-smooth), transform 0.7s var(--ds-transition-smooth) !important;
        }

        .ds-root .ds-fade-in-up.ds-visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        @keyframes ds-pulse {
            0% { opacity: 0.4; transform: scale(0.8); }
            70% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(0.8); }
        }

        /* ===== HEADER ===== */
        .ds-root .ds-header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 1000 !important;
            height: var(--ds-header-height) !important;
            background: rgba(8, 8, 12, 0.75) !important;
            backdrop-filter: blur(18px) !important;
            -webkit-backdrop-filter: blur(18px) !important;
            border-bottom: 1px solid var(--ds-border-mid) !important;
            transition: all 0.3s ease !important;
        }

        .ds-root .ds-header.ds-scrolled {
            background: rgba(8, 8, 12, 0.92) !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5) !important;
        }

        .ds-root .ds-header-inner {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            width: 100% !important;
            max-width: 1280px !important;
            margin: 0 auto !important;
            padding: 0 1.8rem !important;
            height: 100% !important;
        }

        .ds-root .ds-logo {
            font-family: var(--ds-font-display) !important;
            font-weight: 900 !important;
            font-size: 1.6rem !important;
            color: var(--ds-text-primary) !important;
            text-decoration: none !important;
            display: flex !important;
            align-items: center !important;
            gap: 0.6rem !important;
            flex-shrink: 0 !important;
        }

        .ds-root .ds-logo img {
            width: 36px !important;
            height: 36px !important;
            border-radius: 8px !important;
            background: var(--ds-accent-burgundy) !important;
            object-fit: cover !important;
        }

        .ds-root .ds-nav {
            display: flex !important;
            align-items: center !important;
            gap: 2rem !important;
            list-style: none !important;
        }

        .ds-root .ds-nav a {
            color: var(--ds-text-secondary) !important;
            text-decoration: none !important;
            font-size: 0.9rem !important;
            font-weight: 500 !important;
            transition: color 0.2s !important;
            position: relative !important;
            padding: 0.4rem 0 !important;
        }

        .ds-root .ds-nav a::after {
            content: '' !important;
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 0 !important;
            height: 2px !important;
            background: var(--ds-accent-burgundy) !important;
            transition: width 0.3s !important;
            border-radius: 2px !important;
        }

        .ds-root .ds-nav a:hover,
        .ds-root .ds-nav a.ds-active {
            color: var(--ds-text-primary) !important;
        }

        .ds-root .ds-nav a:hover::after,
        .ds-root .ds-nav a.ds-active::after {
            width: 100% !important;
        }

        .ds-root .ds-lang-switch {
            display: flex !important;
            gap: 0.3rem !important;
            background: var(--ds-bg-elevated) !important;
            border-radius: 40px !important;
            padding: 3px !important;
            border: 1px solid var(--ds-border-mid) !important;
        }

        .ds-root .ds-lang-btn {
            background: transparent !important;
            border: none !important;
            color: var(--ds-text-muted) !important;
            padding: 0.4rem 0.9rem !important;
            border-radius: 40px !important;
            cursor: pointer !important;
            font-weight: 600 !important;
            font-size: 0.75rem !important;
            transition: all 0.2s !important;
        }

        .ds-root .ds-lang-btn.ds-active {
            background: var(--ds-accent-burgundy) !important;
            color: white !important;
            box-shadow: 0 2px 8px rgba(139, 58, 74, 0.4) !important;
        }

        .ds-root .ds-mobile-menu-toggle {
            display: none !important;
            background: none !important;
            border: none !important;
            flex-direction: column !important;
            gap: 6px !important;
            cursor: pointer !important;
            padding: 4px !important;
        }

        .ds-root .ds-mobile-menu-toggle span {
            width: 26px !important;
            height: 2px !important;
            background: var(--ds-text-primary) !important;
            border-radius: 2px !important;
            transition: all 0.2s !important;
        }

        @media (max-width: 900px) {
            .ds-root .ds-nav {
                position: fixed !important;
                top: 0 !important;
                right: -100% !important;
                width: 280px !important;
                height: 100vh !important;
                background: rgba(10, 10, 15, 0.96) !important;
                backdrop-filter: blur(28px) !important;
                -webkit-backdrop-filter: blur(28px) !important;
                flex-direction: column !important;
                padding: 6rem 2rem !important;
                gap: 1.8rem !important;
                transition: right 0.4s var(--ds-transition-smooth) !important;
                border-left: 1px solid var(--ds-border-mid) !important;
                z-index: 999 !important;
            }

            .ds-root .ds-nav.ds-open {
                right: 0 !important;
            }

            .ds-root .ds-mobile-menu-toggle {
                display: flex !important;
            }

            .ds-root .ds-lang-switch {
                margin-left: auto !important;
                margin-right: 1rem !important;
            }
        }

        /* ===== HERO ===== */
        .ds-root .ds-hero {
            min-height: 100vh !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            padding-top: var(--ds-header-height) !important;
            position: relative !important;
        }

        .ds-root .ds-hero-bg {
            position: absolute !important;
            inset: 0 !important;
            background-image: url('club.png') !important;
            background-size: cover !important;
            background-position: center 30% !important;
            background-repeat: no-repeat !important;
            opacity: 0.5 !important;
            pointer-events: none !important;
            z-index: 0 !important;
        }

        .ds-root .ds-hero-bg::before {
            content: '' !important;
            position: absolute !important;
            inset: 0 !important;
            background: radial-gradient(ellipse at 30% 40%, rgba(139, 58, 74, 0.2) 0%, transparent 70%) !important;
            pointer-events: none !important;
        }

        .ds-root .ds-hero-content {
            position: relative !important;
            z-index: 2 !important;
            max-width: 900px !important;
            margin: 0 auto !important;
        }

        .ds-root .ds-hero-tag {
            display: inline-block !important;
            padding: 0.2rem 1rem !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 40px !important;
            font-size: 0.75rem !important;
            letter-spacing: 0.1em !important;
            text-transform: uppercase !important;
            background: rgba(0, 0, 0, 0.3) !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            margin-bottom: 1rem !important;
        }

        .ds-root .ds-hero h1 {
            font-size: clamp(3rem, 8vw, 5.8rem) !important;
            font-weight: 900 !important;
            background: linear-gradient(135deg, #f0ede8, #b3aeb8, #d4bbc1) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            color: transparent !important;
            margin-bottom: 0.2em !important;
        }

        .ds-root .ds-hero p {
            font-size: 1.2rem !important;
            color: var(--ds-text-secondary) !important;
            max-width: 600px !important;
            margin: 0 auto 2rem auto !important;
        }

        .ds-root .ds-hero-stats {
            display: flex !important;
            gap: 2rem !important;
            margin-bottom: 2rem !important;
            justify-content: center !important;
            flex-wrap: wrap !important;
        }

        .ds-root .ds-stat-item {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
        }

        .ds-root .ds-stat-number {
            font-family: var(--ds-font-display) !important;
            font-size: 2.2rem !important;
            font-weight: 800 !important;
            line-height: 1 !important;
        }

        .ds-root .ds-stat-label {
            font-size: 0.7rem !important;
            text-transform: uppercase !important;
            letter-spacing: 0.08em !important;
            color: var(--ds-text-muted) !important;
        }

        /* ===== BUTTONS ===== */
        .ds-root .ds-btn {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.6rem !important;
            padding: 0.8rem 1.8rem !important;
            border-radius: 40px !important;
            font-weight: 600 !important;
            font-size: 0.9rem !important;
            cursor: pointer !important;
            transition: all 0.25s ease !important;
            text-decoration: none !important;
            border: none !important;
        }

        .ds-root .ds-btn-primary {
            background: var(--ds-accent-burgundy) !important;
            color: white !important;
            box-shadow: var(--ds-shadow-glow) !important;
        }

        .ds-root .ds-btn-primary:hover {
            background: #b34e62 !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 12px 28px rgba(139, 58, 74, 0.5) !important;
        }

        .ds-root .ds-btn-outline {
            background: transparent !important;
            border: 1.5px solid rgba(255, 255, 255, 0.25) !important;
            color: var(--ds-text-primary) !important;
        }

        .ds-root .ds-btn-outline:hover {
            border-color: var(--ds-accent-burgundy) !important;
            background: rgba(139, 58, 74, 0.1) !important;
        }

        .ds-root .ds-btn-sm {
            padding: 0.25rem 0.8rem !important;
            font-size: 0.7rem !important;
            border-radius: 30px !important;
        }

        /* ===== PLAYER ===== */
        .ds-root .ds-player-wrapper {
            position: sticky !important;
            top: var(--ds-header-height) !important;
            z-index: 900 !important;
            background: rgba(14, 14, 20, 0.92) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border-bottom: 1px solid var(--ds-border-mid) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
        }

        .ds-root .ds-player-inner {
            display: flex !important;
            flex-wrap: wrap !important;
            align-items: center !important;
            gap: 0.8rem !important;
            padding: 0.7rem 1.8rem !important;
            max-width: 1280px !important;
            margin: 0 auto !important;
        }

        .ds-root .ds-player-cover {
            width: 48px !important;
            height: 48px !important;
            border-radius: 8px !important;
            object-fit: cover !important;
            background: var(--ds-bg-elevated) !important;
            border: 1px solid var(--ds-border-mid) !important;
            flex-shrink: 0 !important;
        }

        .ds-root .ds-player-info {
            flex: 2 !important;
            min-width: 120px !important;
        }

        .ds-root .ds-player-track {
            font-weight: 600 !important;
            font-size: 0.85rem !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        .ds-root .ds-player-artist {
            font-size: 0.65rem !important;
            color: var(--ds-text-muted) !important;
        }

        .ds-root .ds-player-controls {
            display: flex !important;
            align-items: center !important;
            gap: 0.2rem !important;
            flex-shrink: 0 !important;
        }

        .ds-root .ds-player-btn {
            background: none !important;
            border: none !important;
            color: var(--ds-text-primary) !important;
            font-size: 1.2rem !important;
            width: 36px !important;
            height: 36px !important;
            border-radius: 50% !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
        }

        .ds-root .ds-player-btn:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            color: var(--ds-accent-burgundy) !important;
        }

        .ds-root .ds-play-btn {
            background: var(--ds-accent-burgundy) !important;
            color: white !important;
            box-shadow: 0 4px 12px rgba(139, 58, 74, 0.5) !important;
        }

        .ds-root .ds-player-timeline {
            display: flex !important;
            align-items: center !important;
            gap: 0.8rem !important;
            flex: 2 !important;
            min-width: 150px !important;
        }

        .ds-root .ds-progress-container {
            flex: 1 !important;
            height: 4px !important;
            background: rgba(255, 255, 255, 0.15) !important;
            border-radius: 4px !important;
            cursor: pointer !important;
            position: relative !important;
        }

        .ds-root .ds-progress-bar-fill {
            width: 0% !important;
            height: 100% !important;
            background: var(--ds-accent-burgundy) !important;
            border-radius: 4px !important;
            transition: width 0.1s linear !important;
        }

        .ds-root .ds-time-display {
            font-size: 0.7rem !important;
            color: var(--ds-text-muted) !important;
            min-width: 40px !important;
            text-align: center !important;
        }

        .ds-root .ds-volume-container {
            width: 100px !important;
            flex-shrink: 0 !important;
        }

        .ds-root .ds-volume-slider {
            width: 100% !important;
            cursor: pointer !important;
            background: rgba(255, 255, 255, 0.15) !important;
            height: 3px !important;
            border-radius: 3px !important;
            -webkit-appearance: none !important;
            appearance: none !important;
        }

        .ds-root .ds-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none !important;
            appearance: none !important;
            width: 12px !important;
            height: 12px !important;
            border-radius: 50% !important;
            background: var(--ds-accent-burgundy) !important;
            cursor: pointer !important;
        }

        .ds-root .ds-volume-slider::-moz-range-thumb {
            width: 12px !important;
            height: 12px !important;
            border-radius: 50% !important;
            background: var(--ds-accent-burgundy) !important;
            cursor: pointer !important;
            border: none !important;
        }

        .ds-root .ds-live-radio {
            display: flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
            background: rgba(139, 58, 74, 0.15) !important;
            padding: 0.3rem 0.8rem !important;
            border-radius: 40px !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
            flex-shrink: 0 !important;
            border: none !important;
            color: var(--ds-text-primary) !important;
            font-family: var(--ds-font-body) !important;
        }

        .ds-root .ds-live-radio:hover {
            background: rgba(139, 58, 74, 0.3) !important;
            transform: scale(1.02) !important;
        }

        .ds-root .ds-live-dot {
            width: 10px !important;
            height: 10px !important;
            background-color: #ff3b3b !important;
            border-radius: 50% !important;
            animation: ds-pulse 1.5s infinite !important;
            box-shadow: 0 0 6px #ff3b3b !important;
        }

        .ds-root .ds-live-text {
            font-size: 0.7rem !important;
            font-weight: 600 !important;
            letter-spacing: 0.03em !important;
            white-space: nowrap !important;
        }

        @media (max-width: 800px) {
            .ds-root .ds-player-inner {
                padding: 0.7rem 1.2rem !important;
                gap: 0.5rem !important;
            }
            .ds-root .ds-player-timeline {
                order: 4 !important;
                width: 100% !important;
                margin-top: 0.3rem !important;
            }
            .ds-root .ds-volume-container {
                order: 5 !important;
                width: 100% !important;
                margin-top: 0.3rem !important;
            }
            .ds-root .ds-live-radio {
                order: 3 !important;
                margin-left: auto !important;
            }
        }

        /* ===== NEWS ===== */
        .ds-root .ds-news-scroll-wrapper {
            overflow-x: auto !important;
            scroll-behavior: smooth !important;
            cursor: grab !important;
            scrollbar-width: thin !important;
            scrollbar-color: var(--ds-accent-burgundy) var(--ds-bg-elevated) !important;
        }

        .ds-root .ds-news-scroll-wrapper::-webkit-scrollbar {
            height: 4px !important;
        }

        .ds-root .ds-news-scroll-wrapper::-webkit-scrollbar-track {
            background: var(--ds-bg-elevated) !important;
            border-radius: 4px !important;
        }

        .ds-root .ds-news-scroll-wrapper::-webkit-scrollbar-thumb {
            background: var(--ds-accent-burgundy) !important;
            border-radius: 4px !important;
        }

        .ds-root .ds-news-grid {
            display: flex !important;
            gap: 1.5rem !important;
            width: max-content !important;
            padding: 0.5rem 0 1rem !important;
        }

        .ds-root .ds-news-card {
            background: var(--ds-bg-card) !important;
            border: 1px solid var(--ds-border-subtle) !important;
            border-radius: var(--ds-radius-lg) !important;
            padding: 1.2rem !important;
            width: 280px !important;
            flex-shrink: 0 !important;
            transition: all 0.3s !important;
        }

        .ds-root .ds-news-card:hover {
            border-color: var(--ds-border-mid) !important;
            transform: translateY(-4px) !important;
            box-shadow: var(--ds-shadow-card) !important;
        }

        .ds-root .ds-news-date {
            font-size: 0.7rem !important;
            color: var(--ds-accent-steel) !important;
            margin-bottom: 0.5rem !important;
        }

        .ds-root .ds-news-card h4 {
            font-size: 1rem !important;
            margin-bottom: 0.3rem !important;
        }

        .ds-root .ds-news-card p {
            font-size: 0.8rem !important;
            color: var(--ds-text-secondary) !important;
        }

        .ds-root .ds-news-tag {
            display: inline-block !important;
            margin-top: 0.6rem !important;
            font-size: 0.65rem !important;
            background: rgba(139, 58, 74, 0.2) !important;
            padding: 0.2rem 0.6rem !important;
            border-radius: 40px !important;
            color: #c98b99 !important;
        }

        /* ===== CATALOG ===== */
        .ds-root .ds-tabs {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 0.6rem !important;
            margin-bottom: 2rem !important;
            border-bottom: 1px solid var(--ds-border-mid) !important;
            padding-bottom: 0.5rem !important;
        }

        .ds-root .ds-tab-btn {
            background: none !important;

<!DOCTYPE html>
<html lang="ru" dir="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkSpirit | Music That Stays in Your Memory</title>

  <!-- Open Graph & Social -->
  <meta property="og:title" content="DarkSpirit — Music That Stays in Your Memory">
  <meta property="og:description" content="Поп-рок группа из 2025. Глубокие песни и энергичные треки для стримов.">
  <meta property="og:image" content="https://via.placeholder.com/1200x630?text=DarkSpirit+Cover">
  <meta property="og:url" content="https://yourdomain.com/">

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MusicGroup",
    "name": "DarkSpirit",
    "description": "Молодая российская поп-рок группа, родившаяся в мае 2025. Два голоса, одна энергия, без границ.",
    "genre": ["Pop Rock", "Alt Pop"],
    "founded": "2025"
  }
  </script>

  <style>
    :root {
      --font-main: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.25rem);
      --gap-sm: 0.75rem;
      --gap-md: 1.5rem;
      --bg-main: #0b0f14;
      --bg-card: #131821;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --border: rgba(255, 255, 255, 0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; transition: color 0.2s; }
    a:hover { color: var(--accent); }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 var(--gap-md); }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11, 15, 20, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
    }

    .nav { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; flex-wrap: wrap; gap: 0.75rem; }
    
    .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--text-primary); }

    nav ul { display: flex; list-style: none; gap: 1.5rem; }
    nav a { font-size: 0.95rem; opacity: 0.7; }
    nav a:hover, nav a[aria-current="page"] { opacity: 1; color: var(--accent); }

    .lang-switch button { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 0.25rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .lang-switch button.active { background: var(--bg-card); color: var(--text-primary); border-color: var(--accent); }

    main { padding-block: 1.5rem; }

    /* Hero */
    .hero { min-height: 90vh; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; top: -50%; left: -10%; width: 200px; height: 200px; background: radial-gradient(circle, var(--accent) 0%, transparent 70%); opacity: 0.4; border-radius: 50%; }
    
    .hero-content { position: relative; z-index: 1; max-width: 700px; padding-bottom: 2rem; }

    h1.hero-title { font-size: clamp(2.5rem, 6vw, 4.5rem); line-height: 1.1; margin-bottom: 0.5rem; letter-spacing: -0.03em; }
    .hero-tag { display: inline-block; padding: 0.4rem 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .hero-text { font-size: clamp(1.1rem, 2vw, 1.35rem); color: var(--text-muted); margin-bottom: 2rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; padding-top: 2rem; border-top: 1px solid var(--border); }
    .stat-item { text-align: center; }
    .stat-number { display: block; font-size: 2.25rem; font-weight: 700; color: var(--accent); margin-bottom: 0.25rem; }
    .stat-label { font-size: 0.9rem; color: var(--text-muted); }

    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; transition: all 0.2s ease; cursor: pointer; }
    .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4); }

    /* General Sections */
    section { padding-block: clamp(3rem, 8vh, 5rem); border-bottom: 1px solid var(--border); }
    h2.section-title { font-size: clamp(1.75rem, 3vw, 2.5rem); margin-bottom: 0.25rem; letter-spacing: -0.02em; }
    .section-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }

    /* Bio */
    .bio-block { display: grid; gap: 2rem; align-items: center; }
    @media (max-width: 768px) { .bio-block { grid-template-columns: 1fr; text-align: center; } .bio-text { margin-top: auto; max-width: 100%; } img.bio-image { border-radius: 50%; box-shadow: 0 20px 40px rgba(0,0,0,0.4); } }
    img.bio-image { width: clamp(200px, 35vw, 360px); height: auto; border-radius: 16px; margin: 0 auto auto 1rem; display: block; }
    .bio-text p { margin-bottom: 1rem; font-size: var(--text-base); color: var(--text-muted); }
    .bio-list { list-style: none; padding: 0; max-width: 650px; margin: 1.5rem auto; }
    .bio-list li { padding-left: 1.25rem; border-left: 3px solid var(--accent); margin-bottom: 0.75rem; font-size: var(--text-base); color: var(--text-primary); }

    /* Photos */
    .photos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .photos-grid img { aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; transition: transform 0.3s ease, filter 0.3s ease; cursor: pointer; }
    .photos-grid img:hover { transform: scale(1.04); filter: brightness(0.95) contrast(1.02); }

    /* Footer */
    footer { padding: 2rem 0; text-align: center; border-top: 2px solid var(--border); margin-top: 3rem; color: var(--text-muted); font-size: 0.95rem; }
    .social-links { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1rem; }

    /* Animations */
    .fade-in-up { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .fade-in-up.is-visible { opacity: 1; transform: none; }

    /* Utility */
    .container-hero { position: relative; z-index: 1; padding-bottom: 2rem; display: flex; justify-content: center; align-items: flex-end; }
  </style>
</head>
<body>
  <header id="site-header">
    <div class="container nav">
      <a href="#" class="logo" aria-label="DarkSpirit Home">DarkSpirit</a>
      
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="#hero" aria-current="page">Главная</a></li>
          <li><a href="#news">Новости</a></li>
          <li><a href="#music">Музыка</a></li>

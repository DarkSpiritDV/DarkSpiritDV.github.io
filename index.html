<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkSpirit — Official Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* ========== ОСНОВНЫЕ ПЕРЕМЕННЫЕ (тёмная тема по умолчанию) ========== */
        :root {
            --bg-primary: #08080c;
            --bg-secondary: #0e0e14;
            --bg-card: #13131b;
            --bg-elevated: #1a1a25;
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-mid: rgba(255, 255, 255, 0.08);
            --text-primary: #e8e6e3;
            --text-secondary: #9d9ba3;
            --text-muted: #6b6972;
            --accent-burgundy: #8b3a4a;
            --accent-burgundy-dim: #5f2733;
            --accent-steel: #9ca3af;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.02) inset;
            --shadow-glow: 0 0 60px rgba(139, 58, 74, 0.15);
            --transition-smooth: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font-display: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
            --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
            --header-height: 70px;
            --player-height: 80px;
        }

        /* Светлая тема */
        body.light-theme {
            --bg-primary: #f5f3f0;
            --bg-secondary: #e8e6e3;
            --bg-card: #ffffff;
            --bg-elevated: #f0ede8;
            --border-subtle: rgba(0, 0, 0, 0.05);
            --border-mid: rgba(0, 0, 0, 0.1);
            --text-primary: #1a1a1c;
            --text-secondary: #4a4a4f;
            --text-muted: #7a7a80;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.1);
            background-image: none;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.2s ease;
            background-image: radial-gradient(ellipse at 20% 15%, rgba(139, 58, 74, 0.06) 0%, transparent 55%),
                              radial-gradient(ellipse at 75% 60%, rgba(45, 74, 107, 0.05) 0%, transparent 55%),
                              radial-gradient(ellipse at 40% 85%, rgba(30, 30, 40, 0.4) 0%, transparent 50%);
        }
        body.light-theme {
            background-image: radial-gradient(ellipse at 20% 15%, rgba(139, 58, 74, 0.02) 0%, transparent 55%);
        }

        /* Остальные стили (без изменений, кроме добавленных новых элементов) */
        h1, h2, h3, .font-display { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
        h2 { font-size: clamp(2rem, 4vw, 2.8rem); margin-bottom: 0.35em; position: relative; display: inline-block; }
        h2::after { content: ''; position: absolute; bottom: -6px; left: 0; width: 50%; height: 2px; background: linear-gradient(90deg, var(--accent-burgundy), transparent); border-radius: 2px; }
        .section-subtitle { color: var(--text-secondary); font-size: 0.95rem; font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2rem; display: block; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.8rem; }
        section { padding: 5rem 0; position: relative; }
        @media (max-width: 768px) { section { padding: 3.2rem 0; } .container { padding: 0 1.2rem; } }

        .fade-in-up { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .fade-in-up.visible { opacity: 1; transform: translateY(0); }
        .fade-in { opacity: 0; transition: opacity 0.7s ease; }
        .fade-in.visible { opacity: 1; }

        /* Header (добавлена кнопка темы) */
        .header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: var(--header-height); background: rgba(8, 8, 12, 0.78); backdrop-filter: blur(18px); border-bottom: 1px solid var(--border-mid); display: flex; align-items: center; }
        body.light-theme .header { background: rgba(245, 243, 240, 0.9); }
        .header.scrolled { background: rgba(8, 8, 12, 0.92); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); }
        .header-inner { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1.8rem; }
        .logo { font-family: var(--font-display); font-weight: 900; font-size: 1.7rem; letter-spacing: 0.03em; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
        .logo img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }
        .nav { display: flex; align-items: center; gap: 1.8rem; list-style: none; }
        .nav a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.03em; transition: color 0.25s ease; position: relative; padding: 0.4rem 0; }
        .nav a::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1.5px; background: var(--accent-burgundy); transition: width 0.3s ease; border-radius: 1px; }
        .nav a:hover, .nav a.active { color: var(--text-primary); }
        .nav a:hover::after, .nav a.active::after { width: 100%; }
